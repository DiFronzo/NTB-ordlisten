<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siden finnes ikke – NTB-ordlisten</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231a1a2e%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%3E%C3%A6%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa; color: #212529; line-height: 1.6; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        header { background: #1a1a2e; color: #fff; padding: 2rem 1.5rem 1.5rem; text-align: center; }
        header h1 { font-size: 1.75rem; }
        main { max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
        main p { margin-bottom: 1.5rem; color: #6c757d; }
        a { color: #0f3460; font-weight: 600; }
    </style>
</head>
<body>
    <header><h1>404</h1></header>
    <main>
        <h2>Siden finnes ikke</h2>
        <p>Adressen du prøvde å åpne finnes ikke, eller siden er flyttet.</p>
        <a id="home" href="/">← Tilbake til ordlisten</a>
    </main>
    <script>
        // On GitHub project pages the site lives under /<repository>/.
        if (location.hostname.endsWith(".github.io")) {
            var repo = location.pathname.split("/")[1];
            if (repo) document.getElementById("home").href = "/" + repo + "/";
        }
    </script>
</body>
</html>
